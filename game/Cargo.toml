[package]
name = "game"
version = "0.1.0"
authors = ["Devin Brite <devin@dwbrite.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["2d", "bevy_dev_tools", "bevy_ui_debug", "ui", "gamepad", "asset_processor"] }
bevy_aseprite_ultra = { version = "0.9.0",  features = ["asset_processing"]}
avian2d = "0.7"
bevy_framepace = { version = "0.22.0" }

steel-core = { git="https://github.com/mattwparas/steel.git", branch = "master", features = ["sync"] }

heapless = "0.9.3"
enum-map = "2.7.3"
crossbeam-channel = "0.5.16"
chrono = "0.4.45"
